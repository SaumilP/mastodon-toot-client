[package]
name = "mastodon-toot-client"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust CLI bot to post scheduled toots to Mastodon from file inputs"
repository = "https://github.com/SaumilP/mastodon-toot-client"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
